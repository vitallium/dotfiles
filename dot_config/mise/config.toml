#:schema https://mise.jdx.dev/schema/mise.json
[settings]
lockfile = true
experimental = true
legacy_version_file = true
not_found_auto_install = false
idiomatic_version_file_enable_tools = [
  "go",
  "node",
  "python",
  "rust",
  "terraform",
  "yarn"
]

minimum_release_age = "3d"
minimum_release_age_excludes = [
  "codex",
  "opencode",
  "usage",
  "pipx:mistral-vibe"
]

trusted_config_paths = [
  "~/Development"
]

[settings.cargo]
binstall = true
binstall_quickinstall = true

[settings.status]
show_env = true
show_tools = false

[settings.npm]
bun = true
package_manager = "pnpm"

[settings.pipx]
# Allow mise to install pipx packages without manual installation of pipx.
uvx = true

[tools]
# Keep Rust on top to satisfy dependencies
rust = { version = "latest", components = "rust-analyzer,rust-src" }
antigravity-cli = "latest"
biome = "latest"
cargo-binstall = "latest"
codex = "latest"
cosign = "3"
container-use = { version = "latest", depends = ["dagger"] }
dagger = "latest"
difftastic = "latest"
chezmoi = "2"
editorconfig-checker = "latest"
fzf = "latest"
grok = "latest"
gum = "latest"
hadolint = "latest"
helix = "latest"
hivemind = "latest"
java = "lts"
just = "latest"
kubectl = "latest"
lazygit = "latest"
opencode = "latest"
prettier = "latest"
python = "3.14.7"
railway = "latest"
ruby = { version = "4.0.6", depends = ["rust"] }
shellcheck = "latest"
shfmt = "latest"
usage = "latest"
uv = "latest"
watchexec = "latest"

"aqua:AlexanderGrooff/mermaid-ascii" = "latest"
"aqua:sharkdp/hexyl" = "latest"

# Rust
"cargo:ast-grep" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:bacon" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:cargo-about" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:cargo-audit" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:cargo-cache" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:cargo-crap" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:cargo-expand" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:cargo-generate" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:cargo-outdated" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:cargo-update" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:eza" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:git-absorb" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:git-cliff" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:gitu" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:jj-cli" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:sqlx-cli" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:tokei" = { version = "latest", depends = ["cargo-binstall"] }
"cargo:topgrade" = { version = "latest", depends = ["cargo-binstall"] }

#
# Node.js
#
node = "lts"
pnpm = "latest"
bun = "latest"
"npm:@bitbonsai/mcpvault" = "latest"
"npm:@devcontainers/cli" = "latest"
"npm:@playwright/mcp" = "latest"
"npm:@railway/cli" = "latest"
"npm:@railway/mcp-server" = "latest"
"npm:@upstash/context7-mcp" = "latest"
"npm:agent-browser" = "latest"
"npm:chrome-devtools-mcp" = "latest"
"npm:knip" = "latest"
"npm:markdownlint-cli2" = "latest"
"npm:oxfmt" = "latest"
"npm:oxlint" = "latest"
"npm:tree-sitter-cli" = "latest"
"npm:yarn" = "latest"

# Python
# "pipx:lsp-devtools" = "latest"
"pipx:pdm" = { version = "latest", depends = ["python", "uv"] }
"pipx:pgcli" = { version = "latest", depends = ["python", "uv"] }
"pipx:ruff" = { version = "latest", depends = ["python", "uv"] }
"pipx:yt-dlp" = { version = "latest", depends = ["python", "uv"] }
"pipx:yubikey-manager" = { version = "latest", depends = ["python", "uv"] }
"pipx:ty" = { version = "latest", depends = ["python", "uv"] }
"pipx:mistral-vibe" = { version = "latest", depends = ["python", "uv"] }

#
# Go
#
go = "latest"
gofumpt = "latest"
golangci-lint = "latest"
golangci-lint-langserver = "latest"
golines = "latest"
goreleaser = "latest"
"go:github.com/fatih/gomodifytags" = "latest"
"go:github.com/go-delve/delve/cmd/dlv" = "latest"
"go:github.com/josharian/impl" = "latest"
"go:github.com/lasorda/protobuf-language-server" = "latest"
"go:go.uber.org/mock/mockgen" = "latest"
"go:golang.org/x/tools/cmd/godoc" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"go:google.golang.org/grpc/cmd/protoc-gen-go-grpc" = "latest"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "latest"
