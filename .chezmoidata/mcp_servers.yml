mcp_servers:
  definitions:
    chrome-devtools: &chrome-devtools
      name: chrome-devtools
      description: Chrome DevTools automation and debugging
      type: local
      command: [chrome-devtools-mcp]
      env: {}
    context7: &context7
      name: context7
      description: Library documentation and code examples
      type: local
      command: [context7-mcp]
      env: {}
    excalidraw: &excalidraw
      name: excalidraw
      description: Excalidraw
      type: remote
      url: https://mcp.excalidraw.com
    container-use: &container-use
      name: container-use
      description: Sandboxed dev environments for coding agents
      type: local
      command: [container-use, stdio]
      env: {}
    railway: &railway
      name: railway
      description: Interact with Railway projects and infrastructure
      type: local
      command: [railway-mcp-server]
      env: {}
    cloudflare: &cloudflare
      name: cloudflare
      description: Interact with Cloudflare
      type: remote
      url: https://mcp.cloudflare.com/mcp
    glean: &glean
      name: glean
      description: GitLab enterprise search and knowledge discovery via Glean
      type: remote
      url: https://gitlab-be.glean.com/mcp/default
    gitlab: &gitlab
      name: gitlab
      description: GitLab MCP server
      type: remote
      url: https://gitlab.com/api/v4/mcp
    gitlab-orbit: &gitlab-orbit
      name: gitlab-orbit
      description: Query the GitLab Knowledge Graph via glab orbit remote CLI subcommands
      type: remote
      url: https://gitlab.com/api/v4/orbit/mcp
    obsidian-personal-darwin: &obsidian-personal-darwin
      name: obsidian
      description: Obsidian
      type: local
      command: [mcpvault, /Users/vslobodin/Documents/Obsidian/Personal]
      env: {}
    obsidian-personal-linux: &obsidian-personal-linux
      name: obsidian
      description: Obsidian
      type: local
      command: [mcpvault, /home/vslobodin/Documents/Obsidian/Personal]
      env: {}
    obsidian-work: &obsidian-work
      name: obsidian
      description: Obsidian
      type: local
      command: [mcpvault, /Users/vslobodin/Documents/Obsidian/GitLab]
      env: {}

  darwin:
    personal:
      - *chrome-devtools
      - *context7
      - *excalidraw
      - *container-use
      - *railway
      - *cloudflare
      - *obsidian-personal-darwin
    work:
      - *chrome-devtools
      - *context7
      - *excalidraw
      - *container-use
      - *glean
      - *gitlab
      - *gitlab-orbit
      - *obsidian-work

  linux:
    personal:
      - *chrome-devtools
      - *context7
      - *excalidraw
      - *container-use
      - *railway
      - *cloudflare
      - *obsidian-personal-linux
    work:
      - *chrome-devtools
      - *context7
      - *excalidraw
      - *container-use
      - *glean
      - *gitlab
      - *gitlab-orbit
      - *obsidian-work
