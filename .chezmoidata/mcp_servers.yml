mcp_servers:
  definitions:
    chrome-devtools: &chrome-devtools
      name: chrome-devtools
      description: Chrome DevTools automation and debugging
      type: local
      command: [chrome-devtools-mcp]
      env: {}
    context7: &context7
      name: context7
      description: Library documentation and code examples
      type: local
      command: [context7-mcp]
      env: {}
    excalidraw: &excalidraw
      name: excalidraw
      description: Excalidraw
      type: remote
      url: https://mcp.excalidraw.com
    container-use: &container-use
      name: container-use
      description: Sandboxed dev environments for coding agents
      type: local
      command: [container-use, stdio]
      env: {}
    railway: &railway
      name: railway
      description: Interact with Railway projects and infrastructure
      type: local
      command: [railway-mcp-server]
      env: {}
    cloudflare: &cloudflare
      name: cloudflare
      description: Interact with Cloudflare
      type: remote
      url: https://mcp.cloudflare.com/mcp
    obsidian: &obsidian
      name: obsidian
      description: Obsidian
      type: local
      command: [mcpvault]
      env: {}

  darwin:
    - *chrome-devtools
    - *context7
    - *excalidraw
    - *container-use
    - *railway
    - *cloudflare
    - *obsidian

  linux:
    - *chrome-devtools
    - *context7
    - *excalidraw
    - *container-use
    - *railway
    - *cloudflare
    - *obsidian
